name: CI/CD

# Pull requests: build + test everything.
# Push to main:  the same checks, then migrate the Supabase database and deploy
#                the game server: Render (default, free) or Fly.io (DEPLOY_TARGET=fly).
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  backend:
    name: Backend tests
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: |
            requirements.txt
            requirements-dev.txt
      - run: pip install -r requirements.txt -r requirements-dev.txt
      - name: Byte-compile
        run: python -m compileall -q server.py rules.py map_layouts.py db bot_ai
      - name: Tests (engine, checkpoint codec, server smoke)
        run: python -m pytest -q tests

  frontend:
    name: Frontend lint + build
    runs-on: ubuntu-latest
    timeout-minutes: 15
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci --no-audit --no-fund
      - run: npm run lint
      - run: npm run build

  migrations:
    name: Database migrations apply cleanly
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      # config.toml reads these with env(); real values are only needed for OAuth.
      SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci
      SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci
      SUPABASE_AUTH_EXTERNAL_DISCORD_CLIENT_ID: ci
      SUPABASE_AUTH_EXTERNAL_DISCORD_SECRET: ci
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Start Postgres and apply every migration
        run: supabase db start
      - name: Sanity-check the schema
        run: |
          q() { psql "postgresql://postgres:postgres@127.0.0.1:54322/postgres" -tAc "$1"; }
          test "$(q 'select count(*) from public.roles')" = "5"
          test "$(q 'select count(*) from public.maps')" = "12"
          test "$(q "select count(*) from pg_proc where proname in ('custom_access_token_hook','claim_orphaned_matches','build_replay','admin_terminate_match')")" = "4"
          test "$(q "select count(*) from pg_tables where schemaname = 'public' and not rowsecurity")" = "0"
          echo "schema OK"

  docker:
    name: Docker image builds
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: docker/setup-buildx-action@v3
      - uses: docker/build-push-action@v6
        with:
          context: .
          push: false
          cache-from: type=gha
          cache-to: type=gha,mode=max

  migrate:
    name: Migrate production database
    if: github.ref == 'refs/heads/main' && (github.event_name == 'push' || github.event_name == 'workflow_dispatch')
    needs: [backend, frontend, migrations, docker]
    runs-on: ubuntu-latest
    timeout-minutes: 15
    environment: production
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: supabase/setup-cli@v1
        with:
          version: latest
      - name: Apply new migrations to Supabase
        env:
          SUPABASE_ACCESS_TOKEN: ${{ secrets.SUPABASE_ACCESS_TOKEN }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          SUPABASE_AUTH_EXTERNAL_GOOGLE_CLIENT_ID: ci
          SUPABASE_AUTH_EXTERNAL_GOOGLE_SECRET: ci
          SUPABASE_AUTH_EXTERNAL_DISCORD_CLIENT_ID: ci
          SUPABASE_AUTH_EXTERNAL_DISCORD_SECRET: ci
        run: |
          supabase link --project-ref "${{ vars.SUPABASE_PROJECT_REF }}"
          supabase db push --yes

  # Default host: Render free web service (render.yaml). Deploys this exact
  # commit through the Render API and follows that deploy until it's live.
  deploy-render:
    name: Deploy to Render
    if: vars.DEPLOY_TARGET != 'fly'
    needs: [migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: ${{ vars.RENDER_URL }}
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    env:
      RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
      SERVICE: ${{ vars.RENDER_SERVICE_ID }}
    steps:
      - name: Deploy and wait until live
        run: |
          if [ -z "$RENDER_API_KEY" ] || [ -z "$SERVICE" ]; then
            echo "::warning::RENDER_API_KEY / RENDER_SERVICE_ID not set; skipping deploy (see docs/deploy.md)."
            exit 0
          fi
          api() { curl -fsS -H "Authorization: Bearer $RENDER_API_KEY" -H "Content-Type: application/json" "$@"; }
          dep=$(api -X POST "https://api.render.com/v1/services/$SERVICE/deploys" -d "{\"commitId\":\"$GITHUB_SHA\"}" \
                | python3 -c "import json,sys; print(json.load(sys.stdin)['id'])")
          echo "Render deploy $dep for $GITHUB_SHA"
          # Free instances build slowly: allow ~25 min.
          for i in $(seq 1 150); do
            status=$(api "https://api.render.com/v1/services/$SERVICE/deploys/$dep" | python3 -c "import json,sys; print(json.load(sys.stdin)['status'])")
            case "$status" in
              live) echo "deploy is live"; exit 0 ;;
              build_failed|update_failed|canceled|deactivated|pre_deploy_failed)
                echo "::error::Render deploy $dep ended with status $status"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Render deploy $dep still '$status' after 25 minutes"; exit 1
      - name: Health check (new commit, database connected)
        if: vars.RENDER_URL != '' && env.RENDER_API_KEY != ''
        run: |
          for i in $(seq 1 30); do
            out=$(curl -fsS -m 60 "${{ vars.RENDER_URL }}/api/health" 2>/dev/null || true)
            if echo "$out" | python3 -c "import json,sys,os; d=json.load(sys.stdin); sys.exit(0 if d.get('commit')==os.environ['GITHUB_SHA'] and d.get('database') else 1)" 2>/dev/null; then
              echo "healthy: $out"; exit 0
            fi
            sleep 10
          done
          echo "::error::health check failed: ${out:-no response}"; exit 1

  # Optional host: Fly.io (fly.toml). Set repository variable DEPLOY_TARGET=fly.
  deploy-fly:
    name: Deploy to Fly.io
    if: vars.DEPLOY_TARGET == 'fly'
    needs: [migrate]
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment:
      name: production
      url: https://catandabuverse.fly.dev
    concurrency:
      group: deploy-production
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
      - uses: superfly/flyctl-actions/setup-flyctl@master
      - name: Deploy game server
        env:
          FLY_API_TOKEN: ${{ secrets.FLY_API_TOKEN }}
        # --ha=false: exactly one machine (rooms live in its memory; see fly.toml).
        run: flyctl deploy --remote-only --ha=false --wait-timeout 300
      - name: Smoke test the live site
        run: |
          for i in $(seq 1 30); do
            if curl -fsS https://catandabuverse.fly.dev/api/health > /dev/null; then echo "live"; exit 0; fi
            sleep 5
          done
          echo "site did not come up" && exit 1
