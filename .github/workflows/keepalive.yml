name: Supabase keep-alive

# Free Supabase projects pause after ~7 days without activity. A tiny read
# every few days keeps the database awake even when nobody is playing.
on:
  schedule:
    - cron: "17 3 */3 * *"   # every 3 days, 03:17 UTC
  workflow_dispatch:

permissions:
  contents: read

jobs:
  ping:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Read the public maps table
        env:
          URL: ${{ vars.SUPABASE_URL }}
          KEY: ${{ vars.SUPABASE_ANON_KEY }}
        run: |
          n=$(curl -fsS "$URL/rest/v1/maps?select=id" -H "apikey: $KEY" | python3 -c "import json,sys; print(len(json.load(sys.stdin)))")
          echo "maps: $n"
          test "$n" -gt 0
