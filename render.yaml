# Render Blueprint: free web service for the CatanDabuVerse game server + web app.
# Create it once in the Render dashboard: New → Blueprint → this repository.
# Deploys are triggered by GitHub Actions (deploy hook) after CI passes, not on push.
services:
  - type: web
    name: catandabuverse
    runtime: docker
    plan: free
    region: singapore              # next to the Supabase project (ap-southeast-1)
    dockerfilePath: ./Dockerfile
    healthCheckPath: /api/health
    autoDeploy: false
    envVars:
      # Public values (also passed to the Docker build as build args for the web app).
      - key: VITE_SUPABASE_URL
        value: https://aeihqbeuqhopxtocelpd.supabase.co
      - key: VITE_SUPABASE_ANON_KEY
        value: eyJhbGciOiJIUzI1NiIsInR5cCI6IkpXVCJ9.eyJpc3MiOiJzdXBhYmFzZSIsInJlZiI6ImFlaWhxYmV1cWhvcHh0b2NlbHBkIiwicm9sZSI6ImFub24iLCJpYXQiOjE3OTE3NTA2NTYsImV4cCI6MjEwNzMyNjY1Nn0.pZ_TxGy3oBgSn4Wv0JGXjJFfra0CCmVwnOCHRgb-zFw
      - key: SUPABASE_URL
        value: https://aeihqbeuqhopxtocelpd.supabase.co
      - key: SERVER_REGION
        value: singapore
      - key: FAILOVER_INTERVAL_SECONDS
        value: "10"
      # Secrets: asked for when the Blueprint is created / generated by Render.
      - key: DATABASE_URL
        sync: false
      - key: IP_HASH_SALT
        generateValue: true
